[package]
name = "rpprof"
version = "0.16.0"
authors = ["Yang Keao <keao.yang@yahoo.com>", "Michael Ingley <46031485+mingley@users.noreply.github.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An updated, maintained CPU and memory profiling tool for Rust programs."
repository = "https://github.com/mingley/pprof-rs"
documentation = "https://docs.rs/rpprof/"
readme = "README.md"
rust-version = "1.96.0"  # MSRV
keywords = ["profiler", "pprof", "cpu-profiler", "flamegraph", "perf"]
categories = ["development-tools::profiling"]

[features]
default = ["cpp"]
cpp = ["symbolic-demangle/cpp"]
flamegraph = ["inferno"]
frame-pointer = []

# A private feature to indicate either prost-codec or protobuf-codec is enabled.
_protobuf = []
prost-codec = ["prost", "prost-build", "sha2", "_protobuf"]
protobuf-codec = ["protobuf", "protobuf-codegen", "_protobuf"]
framehop-unwinder = ["framehop", "memmap2", "object"]
perfmaps = ["arc-swap"]
large-depth = []
huge-depth = []

[dependencies]
backtrace = { version = "0.3.73" }
once_cell = "1.21"
libc = "^0.2.66"
log = "0.4"
nix = { version = ">=0.27, <0.32", default-features = false, features = ["signal"] }
spin = ">=0.10, <0.13"
tempfile = "3.18"
thiserror = "2.0"
findshlibs = "0.10"
cfg-if = "1.0"
smallvec = "1.14"

inferno = { version = "0.12", default-features = false, features = ["nameattr"], optional = true }
prost = { version = ">=0.12, <0.15", optional = true }
protobuf = { version = ">=3.7.2", optional = true }
criterion = { version = ">=0.5, <0.9", optional = true }
aligned-vec = "0.6"

# framehop unwinder dependencies
framehop = { version = ">=0.13, <0.17", optional = true }
memmap2 = { version = ">=0.9.11, <0.10", optional = true }
object = { version = ">=0.32, <0.38", optional = true }
arc-swap = { version = "1.9", optional = true }

[dependencies.symbolic-demangle]
version = ">=12.18, <14"
default-features = false
features = ["rust"]

[dev-dependencies]
criterion = "0.8"
rand = "0.8.8"

[build-dependencies]
prost-build = { version = ">=0.12, <0.15", optional = true }
sha2 = { version = "0.10", optional = true }
protobuf-codegen = { version = "3.7.2", optional = true }

[[example]]
name = "flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "profile_proto_with_prost"
required-features = ["prost-codec"]

[[example]]
name = "profile_proto_with_protobuf_codec"
required-features = ["protobuf-codec"]

[[example]]
name = "multithread_flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "backtrace_while_sampling"
required-features = ["flamegraph"]

[[example]]
name = "criterion"
required-features = ["flamegraph", "criterion"]

[[bench]]
name = "collector"
path = "benches/collector.rs"
harness = false

[[bench]]
name = "addr_validate"
path = "benches/addr_validate.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
